[project]
name = "office-mcp"
version = "0.1.3"
description = "MCP server that works with the signed-in Outlook and Teams apps on a Mac through the accessibility API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.11,<3",
    "starlette>=0.46",
    "uvicorn>=0.34",
    "cryptography>=46,<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "pyobjc-framework-ApplicationServices>=11; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=11; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=11; sys_platform == 'darwin'",
    "regex>=2024.11.6",
]

[project.scripts]
office-mcp = "office_mcp.server:main"
office = "office_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8.4", "mypy>=1.18", "ruff>=0.13", "httpx>=0.28", "types-regex"]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
extend = "../../ruff.toml"

[tool.ruff.lint]
extend-ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.extend-per-file-ignores]
"src/office_mcp/shared/events.py" = ["E741"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = ["$MYPY_CONFIG_FILE_DIR/src", "$MYPY_CONFIG_FILE_DIR/tests"]
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
markers = ["live: drives the real apps on the Mac"]
addopts = "-m 'not live'"
